#------------------------------------------------------------
# Configuration de la leçon — The Carpentries Workbench (sandpaper)
#------------------------------------------------------------

# Programme concerné : incubator = The Carpentries Incubator
carpentry: 'incubator'

# Sous-titre affiché sous le titre, dans l'entête du site
carpentry_description: 'Formation en français, 20 heures'

# Titre affiché sur toutes les pages
title: 'Bash pour la bioinformatique'

# Date de création de la leçon (AAAA-MM-JJ)
created: '2024-09-17'

# Mots-clés, séparés par des virgules
keywords: 'bash, shell, ligne de commande, bioinformatique, français, awk, formats de fichiers'

# Étape du cycle de vie : pre-alpha, alpha, beta, stable
life_cycle: 'pre-alpha'

# Licence du matériel pédagogique
license: 'CC-BY 4.0'

# Dépôt source de la leçon
source: 'https://github.com/BaptisteHerlemont/formation-bash-bioinfo'

# Branche par défaut
branch: 'main'

# Contact en cas de problème
contact: 'baptiste.herlemont@orange.fr'

# Langue de la leçon : active les traductions françaises des éléments
# d'interface fournies par sandpaper (Objectifs, Défi, Solution, etc.)
lang: fr

